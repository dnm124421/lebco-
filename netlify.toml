# TanStack Start builds through Nitro, which auto-detects Netlify and emits
# static assets to `dist/` and the SSR function to `.netlify/functions-internal`.
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/products/model-202"
  to = "/products"
  status = 301
  force = true

[[redirects]]
  from = "/products/bed-fitting"
  to = "/products"
  status = 301
  force = true

[[redirects]]
  from = "/products/table-bracket"
  to = "/products"
  status = 301
  force = true
