# TanStack Start builds through Nitro, which auto-detects Netlify and emits
# static assets to `dist/` and the SSR function to `.netlify/functions-internal`.
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/products/plate-cup-saucer-stand"
  to = "/products/thali-stand"
  status = 301
  force = true

[[redirects]]
  from = "/products/model-202"
  to = "/products"
  status = 301
  force = true

[[redirects]]
  from = "/products/bed-fitting"
  to = "/products"
  status = 301
  force = true

[[redirects]]
  from = "/products/table-bracket"
  to = "/products"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

